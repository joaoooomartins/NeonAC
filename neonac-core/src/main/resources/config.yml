general:
  prefix: "&8[&bNeonAC&8]"
  language: "pt-BR"
  debug: false
  mode: "normal"

metrics:
  enabled: true

storage:
  type: yaml
  mysql:
    host: "localhost"
    port: 3306
    database: "neonac"
    user: "root"
    password: ""
    params: "useSSL=false&serverTimezone=UTC"

alerts:
  enabled: true
  format: "%prefix% &7%player% &8falhou em &b%check% &8VL=&c%vl% &8(&7%ping%ms&8)"
  combat: true
  movement: true
  player: true
  world: true
  packet: true

discord:
  enabled: false
  webhook: ""

punishments:
  enabled: true
  cooldown: 30000
  rules:
    - threshold: 10
      commands:
        - "kick %player% [NeonAC] Comportamento suspeito (%check%)"
    - threshold: 25
      commands:
        - "tempban %player% 1h [NeonAC] %check%"
    - threshold: 50
      commands:
        - "ban %player% [NeonAC] %check%"

