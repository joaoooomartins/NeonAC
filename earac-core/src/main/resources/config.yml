        max: 100.0

# Optional per-version overrides (rgba). Example shown for 1.20 tolerance.
versions:
  "20":
    movement:
      tolerance: 0.05

messages:
  prefix: "&8[&bEarAC&8]"
  no-permission: "%prefix% &cVocê não possui permissão."
