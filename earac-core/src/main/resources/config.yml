general:
  prefix: "&8[&bEarAC&8]"
  language: "pt-BR"
  debug: false

metrics:
  enabled: true

storage:
  type: yaml
  mysql:
    host: "localhost"
    port: 3306
    database: "earac"
    user: "root"
    password: ""
    params: "useSSL=false&serverTimezone=UTC"

alerts:
  enabled: true
  format: "%prefix% &7%player% &8falhou em &b%check% &8VL=&c%vl% &8(&7%ping%ms&8)"
  combat: true
  movement: true
  player: true
  world: true
  packet: true

discord:
  enabled: false
  webhook: ""

punishments:
  enabled: true
  - threshold: 10
    commands:
      - "kick %player% [EarAC] Comportamento suspeito (%check%)"
  - threshold: 25
    commands:
      - "tempban %player% 1h [EarAC] %check%"
  - threshold: 50
    commands:
      - "ban %player% [EarAC] %check%"

checks:
  combat:
    killaura:
      enabled: true
      threshold: 10
      punish: 30
      alert: 2
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    reach:
      enabled: true
      threshold: 10
      punish: 30
      alert: 2
      max-reach: 3.2
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    aim:
      enabled: true
      threshold: 10
      punish: 30
      alert: 2
      max-speed: 1.2
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    autoclicker:
      enabled: true
      threshold: 12
      punish: 40
      alert: 3
      max-cps: 16.0
      vl:
        add: 1.0
        decay: 0.1
        max: 100.0
    velocity:
      enabled: true
      threshold: 8
      punish: 30
      alert: 1
      vl:
        add: 1.0
        decay: 0.1
        max: 100.0
  movement:
    fly:
      enabled: true
      threshold: 12
      punish: 35
      alert: 2
      min-air-ticks: 8
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    speed:
      enabled: true
      threshold: 12
      punish: 35
      alert: 2
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    nofall:
      enabled: true
      threshold: 10
      punish: 30
      alert: 1
      min-fall: 3.0
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    step:
