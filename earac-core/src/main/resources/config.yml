      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    jesus:
      enabled: true
      threshold: 10
      punish: 30
      alert: 1
      min-ticks: 5
      vl:
        add: 1.0
        decay: 0.05
        max: 100.0
    spider:
      enabled: true
      threshold: 10
      punish: 30
      alert: 1
      min-ticks: 6
      vl:
        add: 1.0
