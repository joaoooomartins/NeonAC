      enabled: true
      threshold: 10
      punish: 30
      alert: 1
      max-rate: 14.0
      vl:
        add: 1.0
        decay: 0.1
        max: 100.0
    fastbreak:
      enabled: true
      threshold: 10
      punish: 30
      alert: 1
      max-rate: 8.0
      vl:
        add: 1.0
        decay: 0.1
        max: 100.0
    scaffold:
      enabled: true
