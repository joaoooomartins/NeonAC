name: EarAC
version: 1.0.0
main: com.earac.core.EarACPlugin
api-version: "1.21"
author: EarAC Team
description: Professional, modular, multiversion anti-cheat.
website: https://github.com/your-org/EarAC

commands:
  earac:
    description: EarAC main command
    usage: /earac <subcommand>
    permission: earac.command
    aliases: [earac, ac]

permissions:
  earac.command:
    description: Access to /earac
    default: op
  earac.command.reload:
    description: Reload configuration
    default: op
  earac.command.checks:
    description: List checks
    default: op
  earac.command.debug:
    description: Debug a player
    default: op
  earac.command.violations:
    description: View violations
    default: op
  earac.command.reset:
    description: Reset a player's VL
    default: op
  earac.command.punish:
    description: Force a punishment
    default: op
  earac.command.bypass:
    description: Grant temporary exemption
    default: op
  earac.alerts:
    description: Receive all staff alerts
    default: op
  earac.alerts.combat:
    description: Receive combat alerts
    default: op
  earac.alerts.movement:
    description: Receive movement alerts
    default: op
  earac.alerts.player:
    description: Receive player alerts
    default: op
  earac.bypass:
    description: Bypass all checks
    default: false
  earac.bypass.combat:
    description: Bypass combat checks
    default: false
  earac.bypass.movement:
    description: Bypass movement checks
    default: false
  earac.bypass.player:
    description: Bypass player checks
    default: false
